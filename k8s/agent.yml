apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-system
  template:
    metadata:
      labels:
        app: ai-agent-system
    spec:
      containers:
      - name: ai-agent-system
        image: ai-agent-system:latest
        imagePullPolicy: Never
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: apiKey
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-system
spec:
  type: NodePort
  selector:
    app: ai-agent-system
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
